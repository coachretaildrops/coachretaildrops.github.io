<!DOCTYPE html>
<html>

<head>

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #e8e8e8;
      color: #171717;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      -webkit-font-smoothing: antialiased;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }


    /* =========================
       HEADER
       ========================= */

    header {
      background: #1c1c1a;
      border-bottom: 1px solid #2c2c29;

      padding:
        25px
        42px
        20px;
    }

    .header-inner {
      max-width: 1500px;
      margin: 0 auto;
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }


    /* =========================
       SITE BRAND
       ========================= */

    .site-brand {
      display: flex;
      align-items: baseline;
      gap: 8px;

      min-width: 0;

      color: #f1f0eb;

      white-space: nowrap;

      cursor: pointer;
    }

    .site-title {
      color: #f1f0eb;

      font-size: 22px;

      font-weight: 600;

      letter-spacing: 2.5px;

      text-transform: uppercase;
    }

    .site-tagline {
      color: #aaa9a3;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 16px;

      font-style: italic;

      line-height: 1.3;
    }

    .site-dash {
      color: #777670;
      font-size: 16px;
    }


    /* =========================
       HEADER ACTIONS
       ========================= */

    .header-actions {
      display: flex;

      align-items: center;

      justify-content: flex-end;

      gap: 9px;

      flex-shrink: 0;
    }


    /* =========================
       ALL DROP DATES BUTTON
       ========================= */

    .dates-header {
      display: inline-flex;
      align-items: center;
      gap: 9px;

      padding: 9px 16px;

      border: none;
      outline: none;
      border-radius: 999px;

      background: #eb8bff;
      color: #1c1c1a;

      font-family: inherit;
      font-size: 13px;
      font-weight: 700;

      cursor: pointer;

      transition:
        background 0.18s ease,
        transform 0.18s ease;
    }

    .dates-header:hover {
      background: #d072e3;
      transform: translateY(-1px);
    }

    .dates-header:focus {
      outline: none;
    }

    .dates-header-icon {
      font-size: 15px;
      line-height: 1;
    }

    .dates-header-text {
      white-space: nowrap;
    }


    /* =========================
       DISCORD
       ========================= */

    .discord-header {
      display: flex;

      align-items: center;

      gap: 9px;

      padding:
        9px
        15px;

      border-radius: 999px;

      background: #5865f2;

      color: #ffffff;

      text-decoration: none;

      font-size: 13px;

      font-weight: 700;

      letter-spacing: 0;

      text-transform: none;

      white-space: nowrap;

      box-shadow:
        0 4px 14px rgba(88, 101, 242, 0.18);

      transition:
        background 0.2s ease,
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .discord-header:hover {
      background: #4f5bd5;

      transform: translateY(-1px);

      box-shadow:
        0 6px 18px rgba(88, 101, 242, 0.27);
    }

    .discord-header-icon {
      width: 21px;
      height: 21px;

      display: flex;

      align-items: center;
      justify-content: center;

      flex-shrink: 0;

      border-radius: 50%;

      overflow: hidden;

      background:
        rgba(255, 255, 255, 0.16);
    }

    .discord-header-icon img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;
    }


    /* =========================
       MAIN
       ========================= */

    main {
      max-width: 1500px;

      margin: 0 auto;

      padding:
        0
        42px
        90px;
    }


    /* =========================
       HERO
       ========================= */

    .home-hero {
      min-height: 470px;

      display: flex;

      align-items: center;

      padding:
        70px
        0
        65px;

      border-bottom:
        1px solid #cfcfc9;
    }

    .hero-main {
      width: 100%;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 110px;

      margin: 0 auto;
    }

    .hero-title {
      margin: 0;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size:
        clamp(58px, 7.8vw, 112px);

      font-weight: 400;

      line-height: 0.9;

      letter-spacing: -4px;

      text-align: right;

      padding-right: 0;
    }

    .hero-title span {
      display: block;
    }

    .hero-title span:last-child {
      font-style: italic;
    }


    /* =========================
       CALENDAR AREA
       ========================= */

    .calendar-area {
      display: flex;

      flex-direction: column;

      align-items: center;

      width: 350px;
    }

    .calendar-instruction {
      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 7px;

      margin:
        0
        0
        11px;

      padding:
        7px
        13px;

      border-radius: 999px;

      background: #1c1c1a;

      color: #f1f0eb;

      font-size: 9px;

      font-weight: 600;

      letter-spacing: 0.45px;

      line-height: 1.3;

      text-align: center;

      box-shadow:
        0 3px 10px rgba(0, 0, 0, 0.08);
    }

    .calendar-instruction::before {
      content: "";

      width: 6px;
      height: 6px;

      flex-shrink: 0;

      border-radius: 50%;

      background: #b52828;

      box-shadow:
        0 0 0 2px rgba(181, 40, 40, 0.15);
    }


    /* =========================
       CALENDAR
       ========================= */

    .calendar-widget {
      width: 100%;

      max-width: 350px;

      justify-self: start;

      padding: 24px;

      border-radius: 24px;

      background: #f7f6f2;

      border:
        1px solid #d8d6cf;

      box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.07);

      overflow: hidden;
    }

    .calendar-widget-top {
      display: flex;

      align-items: flex-start;

      justify-content: space-between;

      margin-bottom: 19px;
    }

    .calendar-widget-month {
      margin: 0;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 27px;

      font-weight: 400;

      line-height: 1;
    }

    .calendar-widget-year {
      margin-top: 5px;

      color: #99968f;

      font-size: 9px;

      font-weight: 600;

      letter-spacing: 1.8px;

      text-transform: uppercase;
    }

    .calendar-widget-nav {
      display: flex;

      gap: 5px;
    }

    .calendar-widget-nav button {
      width: 31px;
      height: 31px;

      min-width: 31px;
      min-height: 31px;

      padding: 0;

      display: flex;

      align-items: center;
      justify-content: center;

      border:
        1px solid #d8d6cf;

      border-radius: 50%;

      background: transparent;

      color: #55534e;

      font-size: 13px;

      line-height: 1;

      transition:
        background 0.15s ease,
        transform 0.15s ease;
    }

    .calendar-widget-nav button:hover {
      background: #e7e5df;

      transform: scale(1.05);
    }


    /* =========================
       CALENDAR PAGE ANIMATION
       ========================= */

    .calendar-page {
      animation:
        calendarFlip 0.28s ease;
    }

    @keyframes calendarFlip {

      0% {
        opacity: 0;

        transform:
          perspective(700px)
          rotateY(-8deg);
      }

      100% {
        opacity: 1;

        transform:
          perspective(700px)
          rotateY(0deg);
      }

    }


    /* =========================
       CALENDAR WEEKDAYS
       ========================= */

    .calendar-weekdays {
      display: grid;

      grid-template-columns:
        repeat(7, 1fr);

      width: 100%;

      margin-bottom: 7px;
    }

    .calendar-weekday {
      height: 27px;

      display: flex;

      align-items: center;
      justify-content: center;

      color: #aaa7a0;

      font-size: 8px;

      font-weight: 700;

      letter-spacing: 0.8px;

      text-transform: uppercase;
    }


    /* =========================
       CALENDAR DAYS
       ========================= */

    .calendar-days {
      display: grid;

      grid-template-columns:
        repeat(7, 1fr);

      grid-auto-rows: 38px;

      gap: 3px;

      width: 100%;
    }

    .calendar-day {
      width: 38px;
      height: 38px;

      min-width: 38px;
      min-height: 38px;

      justify-self: center;
      align-self: center;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 0;

      border: 0;

      border-radius: 50%;

      background: transparent;

      color: #45433f;

      font-size: 11px;

      font-weight: 400;

      line-height: 1;

      text-align: center;

      transition:
        background 0.15s ease,
        color 0.15s ease,
        transform 0.15s ease,
        box-shadow 0.15s ease;
    }

    .calendar-day.empty {
      cursor: default;

      pointer-events: none;
    }

    .calendar-day:not(.empty):not(.has-drop):hover {
      background: #e7e5df;
    }


    /* =========================
       DROP DATES
       ========================= */

    .calendar-day.has-drop {
      background: #b52828;

      color: #ffffff;

      font-weight: 700;

      cursor: pointer;

      box-shadow:
        0 2px 5px rgba(181, 40, 40, 0.18);
    }

    .calendar-day.has-drop:hover {
      background: #941f1f;

      transform: scale(1.12);

      box-shadow:
        0 4px 10px rgba(181, 40, 40, 0.25);
    }


    /* =========================
       TODAY
       ========================= */

    .calendar-day.today:not(.has-drop) {
      box-shadow:
        inset 0 0 0 1px #77746e;
    }

    .calendar-day.today.has-drop {
      box-shadow:
        0 0 0 2px #f7f6f2,
        0 0 0 3px #b52828;
    }


    /* =========================
       CALENDAR FOOTER
       ========================= */

    .calendar-footer {
      display: flex;

      align-items: center;

      gap: 8px;

      margin-top: 17px;

      padding-top: 14px;

      border-top:
        1px solid #dedcd5;

      color: #99968f;

      font-size: 8px;

      font-weight: 600;

      letter-spacing: 1px;

      text-transform: uppercase;
    }

    .calendar-footer-dot {
      width: 7px;
      height: 7px;

      flex-shrink: 0;

      border-radius: 50%;

      background: #b52828;
    }


    /* =========================
       UNRELEASED
       ========================= */

    .unreleased-section {
      padding-top: 58px;
    }

    .unreleased-header {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 20px;

      margin-bottom: 25px;
    }

    .unreleased-title-wrap {
      display: flex;

      align-items: center;

      gap: 13px;
    }

    .unreleased-title {
      margin: 0;

      font-size: 17px;

      font-weight: 700;

      letter-spacing: 2px;

      text-transform: uppercase;
    }

    .unreleased-badge {
      display: inline-flex;

      align-items: center;

      gap: 5px;

      padding:
        5px
        9px;

      border-radius: 999px;

      background: #b52828;

      color: #ffffff;

      font-size: 11px;

      font-weight: 700;

      letter-spacing: 1px;

      text-transform: uppercase;
    }

    .unreleased-badge-dot {
      width: 5px;
      height: 5px;

      border-radius: 50%;

      background: #ffffff;
    }

    .unreleased-description {
      color: #99968f;

      font-size: 9px;

      letter-spacing: 0.4px;

      text-align: right;
    }


    /* =========================
       COLLECTIONS
       ========================= */

    .collection {
      margin-bottom: 65px;
    }

    .collection-heading {
      display: flex;

      align-items: center;

      gap: 18px;

      margin-bottom: 25px;
    }

    .collection-name {
      margin: 0;

      font-size: 25px;

      font-weight: 600;

      letter-spacing: 2px;

      text-transform: uppercase;

      white-space: nowrap;
    }

    .collection-rule {
      height: 1px;

      background: #cfcfc9;

      flex: 1;
    }


    /* =========================
       PRODUCT GRID
       ========================= */

    .product-grid {
      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 26px;
    }

    .product-card {
      min-width: 0;

      background: #ffffff;

      border:
        1px solid #deddd8;

      border-radius: 14px;

      padding: 12px;

      overflow: hidden;

      box-shadow:
        0 1px 2px rgba(0, 0, 0, 0.025);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        border-color 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-3px);

      border-color: #d2d0c9;

      box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.08);
    }


    /* =========================
       PRODUCT TOP
       ========================= */

    .product-top {
      min-height: 25px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      padding:
        0
        2px
        8px;
    }

    .product-style {
      min-width: 0;

      color: #77746e;

      font-size: 10px;

      letter-spacing: 0.5px;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    .product-style strong {
      color: #55534e;

      font-weight: 600;

      margin-right: 4px;
    }


    /* =========================
       FLAIR
       ========================= */

    .product-flair {
      flex-shrink: 0;

      display: inline-flex;

      align-items: center;

      gap: 4px;

      padding:
        5px
        9px;

      border-radius: 999px;

      background: #596b16;

      color: #ffffff;

      font-size: 8px;

      font-weight: 700;

      letter-spacing: 0.8px;

      text-transform: uppercase;

      white-space: nowrap;

      box-shadow:
        0 1px 2px rgba(0, 0, 0, 0.08);
    }

    .product-flair-star {
      font-size: 9px;

      line-height: 1;
    }


    /* =========================
       PRODUCT IMAGE
       ========================= */

    .product-image {
      width: 100%;

      aspect-ratio: 1 / 1;

      background: #f0f0f0;

      border-radius: 9px;

      overflow: hidden;

      display: flex;

      align-items: center;
      justify-content: center;
    }

    .product-image img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: contain;

      object-position: center;

      padding: 5%;

      transition:
        transform 0.3s ease;
    }

    .product-card:hover
    .product-image img {
      transform: scale(1.025);
    }

    .no-image {
      width: 100%;
      height: 100%;

      display: flex;

      align-items: center;
      justify-content: center;

      color: #8a8882;

      font-size: 10px;

      letter-spacing: 1px;

      text-transform: uppercase;
    }


    /* =========================
       PRODUCT INFO
       ========================= */

    .product-info {
      padding:
        17px
        5px
        7px;
    }

    .product-name {
      margin-bottom: 13px;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 16px;

      line-height: 1.35;
    }

    .product-name a {
      color: #171717;

      text-decoration: none;
    }

    .product-name a:hover {
      text-decoration: underline;

      text-underline-offset: 3px;
    }

    .product-bottom {
      display: grid;

      grid-template-columns:
        1.7fr
        1fr;

      gap: 15px;
    }

    .product-bottom-item {
      min-width: 0;
    }

    .product-bottom-item:last-child {
      text-align: right;
    }

    .product-bottom-label {
      margin-bottom: 4px;

      color: #96938c;

      font-size: 8px;

      font-weight: 600;

      letter-spacing: 1.3px;

      line-height: 1.2;

      text-transform: uppercase;
    }

    .product-bottom-value {
      color: #4f4d48;

      font-size: 13px;

      line-height: 1.35;

      overflow-wrap: break-word;
    }

    .product-bottom-item:last-child
    .product-bottom-value {
      color: #171717;

      font-weight: 600;

      white-space: nowrap;
    }


    /* =========================
       DROP PAGE
       ========================= */

    .page-top {
      padding-top: 45px;

      margin-bottom: 48px;
    }

    .back-link {
      border: 0;

      background: transparent;

      padding: 0;

      margin-bottom: 27px;

      color: #6e6c66;

      font-size: 10px;

      letter-spacing: 1.8px;

      text-transform: uppercase;
    }

    .back-link:hover {
      color: #111;
    }

    .page-title {
      margin: 0;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 42px;

      font-weight: 400;

      line-height: 1.1;
    }


    /* =========================
       ALL DROP DATES PAGE
       ========================= */

    .all-dates-page {
      padding:
        65px
        0
        90px;
    }

    .all-dates-intro {
      max-width: 750px;

      margin-bottom: 50px;
    }

    .all-dates-eyebrow {
      margin-bottom: 13px;

      color: #9b7941;

      font-size: 9px;

      font-weight: 700;

      letter-spacing: 2px;

      text-transform: uppercase;
    }

    .all-dates-title {
      margin: 0 0 13px;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 52px;

      font-weight: 400;

      line-height: 1;
    }

    .all-dates-description {
      margin: 0;

      color: #77746e;

      font-size: 12px;

      line-height: 1.6;
    }

    .drop-date-list {
      max-width: 900px;

      border-top:
        1px solid #cfcfc9;
    }

    .drop-date-row {
      width: 100%;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 30px;

      padding:
        23px
        5px
        23px
        0;

      border: 0;

      border-bottom:
        1px solid #cfcfc9;

      background: transparent;

      color: #171717;

      text-align: left;

      transition:
        padding 0.2s ease,
        background 0.2s ease;
    }

    .drop-date-row:hover {
      padding-left: 12px;

      padding-right: 12px;

      background: #deddd8;
    }

    .drop-date-main {
      display: flex;

      align-items: center;

      gap: 18px;

      min-width: 0;
    }

    .drop-date-number {
      width: 42px;
      height: 42px;

      flex-shrink: 0;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #b52828;

      color: #ffffff;

      font-size: 11px;

      font-weight: 700;
    }

    .drop-date-name {
      min-width: 0;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 20px;

      line-height: 1.3;

      overflow-wrap: break-word;
    }

    .drop-date-arrow {
      flex-shrink: 0;

      color: #99968f;

      font-size: 18px;

      transition:
        transform 0.2s ease,
        color 0.2s ease;
    }

    .drop-date-row:hover
    .drop-date-arrow {
      color: #171717;

      transform: translateX(3px);
    }

    .no-dated-drops {
      padding:
        35px
        0;

      color: #77746e;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 19px;
    }


    /* =========================
       STATES
       ========================= */

    .loading {
      padding:
        70px
        0;

      color: #77746e;

      font-size: 11px;

      letter-spacing: 1.5px;

      text-transform: uppercase;
    }

    .empty {
      padding:
        70px
        0;

      color: #77746e;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 20px;
    }


    /* =========================
       PLACEHOLDER PAGES
       ========================= */

    .placeholder-page {
      max-width: 700px;

      padding:
        70px
        0
        100px;
    }

    .placeholder-page h1 {
      margin:
        0
        0
        15px;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 42px;

      font-weight: 400;
    }

    .placeholder-page p {
      margin: 0;

      color: #6e6c66;

      font-size: 13px;

      line-height: 1.7;
    }


    /* =========================
       FOOTER
       ========================= */

    footer {
      max-width: 1500px;

      margin: 0 auto;

      padding:
        0
        42px
        35px;

      color: #898680;

      font-size: 10px;

      letter-spacing: 1px;

      text-transform: uppercase;
    }

    .footer-rule {
      height: 1px;

      background: #d8d6d0;

      margin-bottom: 18px;
    }


    /* =========================
       TABLET
       ========================= */

    @media (max-width: 1100px) {

      .site-title {
        font-size: 19px;
      }

      .site-tagline {
        font-size: 11px;
      }

      .site-dash {
        font-size: 11px;
      }

      .hero-main {
        gap: 55px;
      }

      .hero-title {
        font-size:
          clamp(52px, 7vw, 85px);
      }

      .calendar-widget {
        padding: 21px;
      }

      .calendar-widget-month {
        font-size: 23px;
      }

      .calendar-days {
        grid-auto-rows: 34px;
      }

      .calendar-day {
        width: 34px;
        height: 34px;

        min-width: 34px;
        min-height: 34px;
      }

      .product-grid {
        grid-template-columns:
          repeat(3, minmax(0, 1fr));
      }

    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 760px) {

      header {
        padding:
          20px;
      }

      .top-row {
        align-items: flex-start;

        gap: 15px;
      }

      .site-brand {
        display: block;

        white-space: normal;
      }

      .site-title {
        display: inline;

        font-size: 18px;
      }

      .site-dash {
        display: inline;

        margin-left: 4px;

  <script>


    /* =========================
       GOOGLE SHEETS API
       ========================= */

    const API_URL =
      "https://script.google.com/macros/s/AKfycbwgLeNsrDDVXQeafRck5RYhcnpTopXRTFXzcBJ6a0pa1bLRJ50Ub7dUL0uy5fECwyijsw/exec";


    async function apiRequest(
      action,
      sheetName
    ) {

      let url =
        API_URL +
        "?action=" +
        encodeURIComponent(action);


      if (sheetName) {

        url +=
          "&sheet=" +
          encodeURIComponent(sheetName);

      }


      const response =
        await fetch(url);


      if (!response.ok) {

        throw new Error(
          "API request failed: " +
          response.status
        );

      }


      return await response.json();

    }


    /* =========================
       GLOBAL DATA
       ========================= */

    let dropSheets = [];

    let dropDateMap = {};

    let calendarDate = new Date();


    /* =========================
       START
       ========================= */

    document.addEventListener(
      "DOMContentLoaded",
      function() {

        showHome();

        loadDropSheets();

      }
    );


    /* =========================
       LOAD DROP SHEETS
       ========================= */

    function loadDropSheets() {

      apiRequest("sheets")

        .then(
          function(sheets) {

            dropSheets =
              Array.isArray(sheets)
                ? sheets
                : [];


            console.log(
              "Drop sheets received:",
              dropSheets
            );


            buildCalendarDropMap();

            renderCalendar();

            loadUnreleasedProducts();

          }
        )

        .catch(
          function(error) {

            console.error(
              "Unable to load drop sheets:",
              error
            );

            dropSheets = [];

            renderCalendar();

            loadUnreleasedProducts();

          }
        );

    }


    /* =========================
       BUILD CALENDAR MAP
       ========================= */

    function buildCalendarDropMap() {

      dropDateMap = {};


      dropSheets.forEach(
        function(sheet) {

          if (!sheet || !sheet.name) {
            return;
          }


          const parsedDate =
            parseSheetDate(
              sheet.name
            );


          if (!parsedDate) {

            console.log(
              "Not a dated sheet:",
              sheet.name
            );

            return;

          }


          const key =
            makeDateKey(
              parsedDate.getFullYear(),
              parsedDate.getMonth(),
              parsedDate.getDate()
            );


          dropDateMap[key] =
            sheet.name;


          console.log(
            "Calendar date found:",
            key,
            "→",
            sheet.name
          );

        }
      );


      console.log(
        "Final calendar map:",
        dropDateMap
      );

    }


    /* =========================
       PARSE WRITTEN-OUT DATE
       ========================= */

    function parseSheetDate(name) {

      if (!name) {
        return null;
      }


      const value =
        String(name)
          .trim();


      const match =
        value.match(
          /^([A-Za-z]+)\s+(\d{1,2}),\s*(\d{4})/
        );


      if (!match) {

        return null;

      }


      const monthName =
        match[1];

      const day =
        Number(match[2]);

      const year =
        Number(match[3]);


      const monthNames = [

        "january",
        "february",
        "march",
        "april",
        "may",
        "june",
        "july",
        "august",
        "september",
        "october",
        "november",
        "december"

      ];


      const month =
        monthNames.indexOf(
          monthName.toLowerCase()
        );


      if (month === -1) {

        return null;

      }


      const date =
        new Date(
          year,
          month,
          day
        );


      if (
        date.getFullYear() !== year ||
        date.getMonth() !== month ||
        date.getDate() !== day
      ) {

        return null;

      }


      return date;

    }


    /* =========================
       DATE KEY
       ========================= */

    function makeDateKey(
      year,
      month,
      day
    ) {

      return (
        year +
        "-" +
        String(
          month + 1
        ).padStart(
          2,
          "0"
        ) +
        "-" +
        String(day).padStart(
          2,
          "0"
        )
      );

    }


    /* =========================
       RENDER CALENDAR
       ========================= */

    function renderCalendar() {

      const monthElement =
        document.getElementById(
          "calendarWidgetMonth"
        );


      const yearElement =
        document.getElementById(
          "calendarWidgetYear"
        );


      const daysElement =
        document.getElementById(
          "calendarDays"
        );


      if (
        !monthElement ||
        !yearElement ||
        !daysElement
      ) {

        return;

      }


      const year =
        calendarDate.getFullYear();


      const month =
        calendarDate.getMonth();


      const monthDate =
        new Date(
          year,
          month,
          1
        );


      monthElement.textContent =
        monthDate.toLocaleDateString(
          "en-US",
          {
            month: "long"
          }
        );


      yearElement.textContent =
        year;


      const firstDay =
        monthDate.getDay();


      const daysInMonth =
        new Date(
          year,
          month + 1,
          0
        ).getDate();


      const today =
        new Date();


      let html = "";


      for (
        let i = 0;
        i < firstDay;
        i++
      ) {

        html += `

          <div
            class="calendar-day empty"
            aria-hidden="true"
          ></div>

        `;

      }


      for (
        let day = 1;
        day <= daysInMonth;
        day++
      ) {

        const key =
          makeDateKey(
            year,
            month,
            day
          );


        const dropName =
          dropDateMap[key];


        const hasDrop =
          !!dropName;


        const isToday =
          today.getFullYear() === year &&
          today.getMonth() === month &&
          today.getDate() === day;


        let classes =
          "calendar-day";


        if (hasDrop) {

          classes +=
            " has-drop";

        }


        if (isToday) {

          classes +=
            " today";

        }


        if (hasDrop) {

          html += `

            <button
              type="button"
              class="${classes}"
              data-drop="${escapeAttribute(dropName)}"
              title="View ${escapeAttribute(dropName)}"
              onclick="openCalendarDropFromButton(this, event)"
            >
              ${day}
            </button>

          `;

        } else {

          html += `

            <div
              class="${classes}"
            >
              ${day}
            </div>

          `;

        }

      }


      daysElement.innerHTML =
        html;


      const page =
        document.getElementById(
          "calendarPage"
        );


      if (page) {

        page.classList.remove(
          "calendar-page"
        );


        void page.offsetWidth;


        page.classList.add(
          "calendar-page"
        );

      }

    }


    /* =========================
       CALENDAR CLICK
       ========================= */

    function openCalendarDropFromButton(
      button,
      event
    ) {

      if (event) {

        event.preventDefault();

        event.stopPropagation();

      }


      if (!button) {
        return;
      }


      const sheetName =
        button.getAttribute(
          "data-drop"
        );


      if (!sheetName) {

        console.error(
          "No sheet name attached to calendar date."
        );

        return;

      }


      console.log(
        "Opening calendar drop:",
        sheetName
      );


      showDrop(sheetName);

    }


    /* =========================
       CHANGE MONTH
       ========================= */

    function changeCalendarMonth(
      amount
    ) {

      calendarDate =
        new Date(
          calendarDate.getFullYear(),
          calendarDate.getMonth() + amount,
          1
        );


      renderCalendar();

    }


    /* =========================

                    </button>

                    </button>

                  </div>

                </div>


                <div class="calendar-weekdays">

                  <div class="calendar-weekday">
                    S
                  </div>

                  <div class="calendar-weekday">

                  </div>

                  <div class="calendar-weekday">

                  </div>

                  <div class="calendar-weekday">

                  <div class="calendar-weekday">

                  </div>

                  <div class="calendar-weekday">

                  </div>

                  <div class="calendar-weekday">
                    S
                  </div>

                </div>


                <div
                  id="calendarDays"
                  class="calendar-days"
                ></div>


                <div class="calendar-footer">

                  <span
                    class="calendar-footer-dot"
                  ></span>

                  Retail drop

                </div>

            </div>

        </section>


        <section

          <div class="unreleased-header">

            <div class="unreleased-title-wrap">

              <h2 class="unreleased-title">

          </div>


          <div id="unreleasedContent">

          </div>

        </section>

      `;


      renderCalendar();


      if (

      ) {

      }

    }


    /* =========================
       ALL DROP DATES PAGE
       ========================= */

    function showAllDropDates() {

      const app =
        document.getElementById(
          "app"
        );


      app.innerHTML = `

        <section class="all-dates-page">

          <div class="all-dates-intro">

            <button
              type="button"
              class="back-link"
              onclick="showHome()"

            </button>

              Retail Calendar
            </div>


            <h1 class="all-dates-title">

            </h1>


            <p class="all-dates-description">
              Every confirmed Coach retail drop currently
              cataloged. Select a date to view the products.
            </p>

          </div>


          <div
            id="allDropDatesList"
            class="drop-date-list"
          >

            <div class="loading">
              Loading dates...
            </div>

          </div>

        </section>

      `;


      renderAllDropDates();

    }


    /* =========================
       RENDER ALL DROP DATES
       ========================= */

    function renderAllDropDates() {

      const container =
        document.getElementById(
          "allDropDatesList"
        );


      if (!container) {
        return;
      }


      const datedSheets =
        dropSheets

          .map(
            function(sheet) {

              if (
                !sheet ||
                !sheet.name
              ) {

                return null;

              }


              const date =
                parseSheetDate(
                  sheet.name
                );


              if (!date) {

                return null;

              }


              return {

                name:
                  sheet.name,

                date:
                  date

              };

            }
          )

          .filter(
            function(item) {

              return item !== null;

            }
          );


      datedSheets.sort(
        function(a, b) {

          return (
            a.date.getTime() -
            b.date.getTime()
          );

        }
      );


      const seenDates = {};

      const uniqueSheets = [];


      datedSheets.forEach(
        function(item) {

          const key =
            makeDateKey(
              item.date.getFullYear(),
              item.date.getMonth(),
              item.date.getDate()
            );


          if (
            seenDates[key]
          ) {

            return;

          }


          seenDates[key] =
            true;


          uniqueSheets.push(
            item
          );

        }
      );


      if (
        uniqueSheets.length === 0
      ) {

        container.innerHTML = `

          <div class="no-dated-drops">
            No confirmed drop dates have been added yet.
          </div>

        `;

        return;

      }


      container.innerHTML =
        uniqueSheets
          .map(
            function(item) {

              const date =
                item.date;


              const day =
                date.getDate();


              const formattedDate =
                date.toLocaleDateString(
                  "en-US",
                  {
                    month: "long",
                    day: "numeric",
                    year: "numeric"
                  }
                );


              return `

                <button
                  type="button"
                  class="drop-date-row"
                  data-drop="${escapeAttribute(item.name)}"
                  onclick="openDateListDrop(this, event)"
                >

                  <span class="drop-date-main">

                    <span class="drop-date-number">
                      ${day}
                    </span>

                    <span class="drop-date-name">
                      ${escapeHtml(formattedDate)}
                    </span>

                  </span>


                  <span class="drop-date-arrow">
                    →
                  </span>

                </button>

              `;

            }
          )
          .join("");

    }


    /* =========================
       OPEN DATE LIST DROP
       ========================= */

    function openDateListDrop(
      button,
      event
    ) {

      if (event) {

        event.preventDefault();

        event.stopPropagation();

      }


      if (!button) {
        return;
      }


      const sheetName =
        button.getAttribute(
          "data-drop"
        );


      if (!sheetName) {
        return;
      }


      showDrop(sheetName);

    }


    /* =========================
       UNRELEASED CHECK
       ========================= */

    function isUnreleasedSheetName(
      name
    ) {

      const normalized =
        String(name || "")
          .toLowerCase()
          .trim();


      return (
        normalized.includes("unreleased") ||
        normalized.includes("no date") ||
        normalized.includes("no dates") ||
        normalized.includes("undated") ||
        normalized.includes("not dated")
      );

    }


    /* =========================
       LOAD UNRELEASED
       ========================= */

    function loadUnreleasedProducts() {

      const container =
        document.getElementById(
          "unreleasedContent"
        );


      if (!container) {
        return;
      }


      const specialSheet =
        dropSheets.find(
          function(sheet) {

            return isUnreleasedSheetName(
              sheet.name
            );

          }
        );


      if (!specialSheet) {

        container.innerHTML = `

          <div class="empty">
            No unreleased products found.
          </div>

        `;

        return;

      }


      apiRequest(
        "products",
        specialSheet.name
      )

        .then(
          function(products) {

            renderUnreleasedProducts(
              products
            );

          }
        )

        .catch(
          function(error) {

            console.error(error);

            container.innerHTML = `

              <div class="empty">
                Unable to load unreleased products.
              </div>

            `;

          }
        );

    }


    /* =========================
       RENDER UNRELEASED
       ========================= */

    function renderUnreleasedProducts(
      products
    ) {

      const container =
        document.getElementById(
          "unreleasedContent"
        );


      if (!container) {
        return;
      }


      if (
        !products ||
        products.length === 0
      ) {

          <div class="empty">
            No unreleased products found.
          </div>

        `;

        return;

      }


      renderProductGroups(
        container,
        products
      );

    }

       SHOW DROP
       ========================= */

    function showDrop(sheetName) {

      const app =
        document.getElementById(

        <section class="page-top">

        </section>


        <div id="dropContent">

            Loading products...
          </div>

        </div>

      `;


      apiRequest(
        "products",
        sheetName
      )

        .then(
          function(products) {

            renderDropProducts(
              products
            );

          }
        )

        .catch(
          function(error) {

            console.error(error);

            const content =
              document.getElementById(
                "dropContent"
              );


            if (content) {

              content.innerHTML = `

                <div class="empty">
                  Unable to load this drop.
                </div>

              `;

            }

          }
        );

    }


    /* =========================
       RENDER DROP PRODUCTS
       ========================= */

    function renderDropProducts(
      products
    ) {

      const container =
        document.getElementById(
          "dropContent"
        );


      if (!container) {
        return;
      }


      if (
        !products ||
        products.length === 0
      ) {

        container.innerHTML = `

          <div class="empty">
            No products found.
          </div>

        `;

        return;

      }


      renderProductGroups(
        container,
        products
      );

    }


    /* =========================
       RENDER PRODUCT GROUPS
       ========================= */

    function renderProductGroups(
      container,
      products
    ) {

      const groups = {};


      products.forEach(
        function(product) {

          const collection =
            product.collection &&
            String(
              product.collection
            ).trim()
              ? String(
                  product.collection
                ).trim()
              : "Other";


          if (!groups[collection]) {

            groups[collection] = [];

          }


          groups[collection].push(
            product
          );

        }
      );


      const collectionNames =
        Object.keys(groups);


      container.innerHTML =
        collectionNames
          .map(
            function(collectionName) {

              return `

                <section class="collection">

                  <div class="collection-heading">

                    <h2 class="collection-name">
                      ${escapeHtml(collectionName)}
                    </h2>

                    <div class="collection-rule"></div>

                  </div>


                  <div class="product-grid">

                    ${groups[collectionName]
                      .map(
                        renderProductCard
                      )
                      .join("")}

                  </div>

                </section>

              `;

            }
          )
          .join("");

    }


    /* =========================
       PRODUCT CARD
       ========================= */

    function renderProductCard(
      product
    ) {

      let imageHtml = "";


      if (product.image) {

        imageHtml = `

          <img
            src="${escapeAttribute(product.image)}"
            alt="${escapeAttribute(product.bagName || "")}"
            loading="lazy"
          >

        `;

      } else {

        imageHtml = `

          <div class="no-image">
            No Image
          </div>

        `;

      }


      let nameHtml =
        escapeHtml(
          product.bagName || ""
        );


      if (product.bagUrl) {

        nameHtml = `

          <a
            href="${escapeAttribute(product.bagUrl)}"
            target="_blank"
            rel="noopener noreferrer"
          >
            ${escapeHtml(
              product.bagName || ""
            )}
          </a>

        `;

      }


      const styleNumber =
        product.styleNumber &&
        String(
          product.styleNumber
        ).trim()
          ? escapeHtml(
              product.styleNumber
            )
          : "—";


      const color =
        product.color &&
        String(
          product.color
        ).trim()
          ? escapeHtml(
              product.color
            )
          : "—";


      const formattedCost =
        formatCost(
          product.cost
        );


      const price =
        formattedCost
          ? escapeHtml(
              formattedCost
            )
          : "—";


      const flair =
        product.flair &&
        String(
          product.flair
        ).trim()
          ? `

              <div class="product-flair">

                <span class="product-flair-star">
                  ★
                </span>

                ${escapeHtml(
                  product.flair
                )}

              </div>

            `
          : "";


      return `

        <article class="product-card">


          <div class="product-top">

            <div class="product-style">

              <strong>
                Style Number:
              </strong>

              ${styleNumber}

            </div>


            ${flair}

          </div>


          <div class="product-image">
            ${imageHtml}
          </div>


          <div class="product-info">

            <div class="product-name">
              ${nameHtml}
            </div>


            <div class="product-bottom">


              <div class="product-bottom-item">

                <div class="product-bottom-label">
                  Color
                </div>

                <div class="product-bottom-value">
                  ${color}
                </div>

              </div>


              <div class="product-bottom-item">

                <div class="product-bottom-label">
                  Price
                </div>

                <div class="product-bottom-value">
                  ${price}
                </div>

              </div>


            </div>

          </div>

        </article>

      `;

    }


    /* =========================
       PRICE
       ========================= */

    function formatCost(value) {

      if (
        value === null ||
        value === undefined ||
        String(value).trim() === ""
      ) {

        return "";

      }


      let cost =
        String(value).trim();


      cost =
        cost
          .replace(/^\$/, "")
          .replace(/,/g, "")
          .trim();


      const number =
        Number(cost);


      if (!isNaN(number)) {

        return "$" +
          number.toLocaleString(
            "en-US",
            {
              minimumFractionDigits: 0,
              maximumFractionDigits: 2
            }
          );

      }


      return "$" + cost;

    }


    /* =========================
       LEAKS
       ========================= */

    function showLeaks() {

      const app =
        document.getElementById(
          "app"
        );


      app.innerHTML = `

        <section class="placeholder-page">

          <button
            type="button"
            class="back-link"
            onclick="showHome()"
          >
            ← Home
          </button>


          <h1>
            Leaks
          </h1>


          <p>
            Products that have been seen or identified
            but do not yet have a confirmed retail drop date.
          </p>

        </section>

      `;

    }


    /* =========================
       ARCHIVE
       ========================= */

    function showArchive() {

      const app =
        document.getElementById(
          "app"
        );


      app.innerHTML = `

        <section class="placeholder-page">

          <button
            type="button"
            class="back-link"
            onclick="showHome()"
          >
            ← Home
          </button>


          <h1>
            Archive
          </h1>


          <p>
            Previous Coach retail drops will be
            cataloged here.
          </p>

        </section>

      `;

    }


    /* =========================
       ESCAPE HTML
       ========================= */

    function escapeHtml(value) {

      if (
        value === null ||
        value === undefined
      ) {

        return "";

      }


      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* =========================
       ESCAPE ATTRIBUTE
       ========================= */

    function escapeAttribute(value) {

      if (
        value === null ||
        value === undefined
      ) {

        return "";

      }


      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        );

    }

  </script>

</body>
